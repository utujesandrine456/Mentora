<header [ngClass]="{
    'fixed top-0 inset-x-0 z-50 transition-all duration-500 border-b': true,
    'bg-white/95 backdrop-blur-xl shadow-lg border-blue-100 py-4': isScrolled,
    'bg-white/80 backdrop-blur-md border-transparent py-6': !isScrolled
  }">
  <div class="max-w-7xl mx-auto px-6 flex items-center justify-between">
    <!-- Logo -->
    <div class="flex items-center gap-2 group cursor-pointer" (click)="scrollToSection('home')">
      <div
        class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center transform group-hover:rotate-12 transition-transform duration-300 shadow-lg shadow-blue-200">
        <span class="text-white font-black text-2xl">M</span>
      </div>
      <h1 class="text-2xl font-black tracking-tighter text-blue-950 transition-colors duration-300">
        Mentora
      </h1>
    </div>

    <!-- Nav Links -->
    <nav class="hidden md:flex items-center gap-1">
      <button *ngFor="let item of navItems" (click)="scrollToSection(item.id)" [ngClass]="{
          'px-4 py-2 text-sm font-bold rounded-xl cursor-pointer transition-all duration-300': true,
          'text-blue-600 bg-blue-50': activeSection === item.id,
          'text-blue-900/60 hover:text-blue-600 hover:bg-blue-50/50': activeSection !== item.id
        }">
        {{ item.label }}
      </button>
    </nav>

    <button routerLink="login" class="px-8 py-3 bg-blue-600 cursor-pointer text-white text-sm font-black rounded-xl hover:bg-blue-700 transition-all shadow-xl shadow-blue-200 active:scale-95">
      Login
    </button>
  </div>
</header>
