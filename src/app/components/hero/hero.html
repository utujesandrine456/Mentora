<section id="home" class="relative min-h-screen flex items-center justify-center overflow-hidden bg-white px-6 pt-20">
  <!-- Decorative Background Elements -->
  <div class="absolute top-0 right-0 w-1/2 h-full bg-blue-50/50 clip-path-hero -z-10"></div>
  <div class="absolute -top-24 -right-24 w-96 h-96 bg-blue-600/5 rounded-full blur-3xl -z-10 animate-pulse"></div>
  <div class="absolute top-1/4 left-10 w-4 h-4 bg-blue-400 rounded-full animate-bounce delay-100"></div>
  <div class="absolute bottom-1/4 right-1/4 w-3 h-3 bg-blue-600 rounded-full animate-bounce delay-300"></div>

  <!-- Content Grid -->
  <div class="max-w-7xl mx-auto grid lg:grid-cols-2 gap-12 items-center relative z-10 w-full">

    <!-- Left: Text Content -->
    <div class="space-y-8 animate-fade-in-up">
      <h1 class="text-4xl lg:text-5xl font-black text-blue-950 leading-[1.1] tracking-tighter py-8">
        Elevate Your <span class="text-blue-600">Potential</span> with Mentora
      </h1>

      <p class="text-normal text-blue-900/60 max-w-lg leading-relaxed font-medium">
        {{ subtitle }} Connect with industry leaders and master new skills through our premium, interactive mentorship
        platform.
      </p>

      <div class="flex flex-wrap gap-6">
        <button routerLink="signup" class="group cursor-pointer relative px-8 py-5 bg-blue-600 text-white rounded-2xl font-bold text-normal overflow-hidden shadow-2xl shadow-blue-200 transition-all hover:scale-105 active:scale-95 flex items-center gap-3">
          <span class="relative z-10">Start Your Journey</span>
          <svg xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5 relative z-10 group-hover:translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
          </svg>
        </button>

        <button routerLink="signup" class="px-8 py-5 bg-white cursor-pointer text-blue-600 border-2 border-blue-100 rounded-2xl font-bold text-normal hover:border-blue-600 hover:bg-blue-50 transition-all active:scale-95">
          Apply As Mentor
        </button>
      </div>

      <!-- Trust Badges or Stats -->
      <div class="flex gap-10 pt-4 border-t border-blue-50">
        <div>
          <div class="text-3xl font-black text-blue-950">500+</div>
          <div class="text-sm font-bold text-blue-900/40 uppercase">Expert Mentors</div>
        </div>
        <div>
          <div class="text-3xl font-black text-blue-950">10k+</div>
          <div class="text-sm font-bold text-blue-900/40 uppercase">Active Students</div>
        </div>
      </div>
    </div>

    <!-- Right: Interactive Visual -->
    <div class="relative hidden lg:block animate-fade-in-right py-12">
      <div class="relative z-10 bg-blue-50 rounded-[3rem] p-8 border border-blue-100/50 shadow-2xl overflow-hidden">
        <img src="assets/online-learning-student.jpg" alt="Mentora Education"
          class="rounded-4xl w-full h-150 object-cover mix-blend-multiply opacity-80">
        <div
          class="absolute top-10 right-10 bg-white/90 backdrop-blur-md p-4 rounded-2xl shadow-xl border border-blue-50 animate-bounce-slow">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-green-100 rounded-full flex items-center justify-center">
              <i class="fas fa-check text-green-600"></i>
            </div>
            <div>
              <div class="text-xs font-bold text-blue-900/40">Success Rate</div>
              <div class="text-lg font-black text-blue-950">98.5%</div>
            </div>
          </div>
        </div>

        <div
          class="absolute bottom-10 left-10 bg-white/90 backdrop-blur-md p-6 rounded-2xl shadow-xl border border-blue-50 animate-float">
          <div class="flex -space-x-3 mb-3">
            <div class="w-8 h-8 rounded-full bg-blue-200 border-2 border-white"></div>
            <div class="w-8 h-8 rounded-full bg-blue-300 border-2 border-white"></div>
            <div class="w-8 h-8 rounded-full bg-blue-400 border-2 border-white"></div>
          </div>
          <div class="text-sm font-bold text-blue-950">Join our community</div>
        </div>
      </div>
    </div>
  </div>
</section>
